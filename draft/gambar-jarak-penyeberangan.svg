<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">
  <title>Perbandingan jarak penyeberangan: tanpa dan dengan halte median</title>
  <defs>
    <marker id="panah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/>
    </marker>
    <marker id="panahArus" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,10 L5,0 L10,10 z" fill="#8A8178"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="600" fill="#FFFFFF"/>

  <!-- ============ PANEL A ============ -->
  <text x="40" y="38" font-size="17" font-weight="700" fill="#1F2937">A. Tanpa halte median</text>
  <text x="40" y="58" font-size="12.5" fill="#4B5563">Jalan satu arah, empat lajur kendaraan</text>

  <!-- trotoar -->
  <rect x="40" y="76" width="70" height="160" fill="#EDE6DA"/>
  <rect x="630" y="76" width="70" height="160" fill="#EDE6DA"/>
  <text x="75" y="160" font-size="11" fill="#7A6E5A" text-anchor="middle" transform="rotate(-90 75 160)">TROTOAR</text>
  <text x="665" y="160" font-size="11" fill="#7A6E5A" text-anchor="middle" transform="rotate(90 665 160)">TROTOAR</text>

  <!-- lajur -->
  <rect x="110" y="76" width="520" height="160" fill="#D4CEC6"/>
  <g stroke="#FFFFFF" stroke-width="2" stroke-dasharray="14 10">
    <line x1="240" y1="76" x2="240" y2="236"/>
    <line x1="370" y1="76" x2="370" y2="236"/>
    <line x1="500" y1="76" x2="500" y2="236"/>
  </g>
  <g font-size="11.5" fill="#5E5850" text-anchor="middle">
    <text x="175" y="98">Lajur 1</text>
    <text x="305" y="98">Lajur 2</text>
    <text x="435" y="98">Lajur 3</text>
    <text x="565" y="98">Lajur 4</text>
  </g>
  <g stroke="#8A8178" stroke-width="2" marker-end="url(#panahArus)">
    <line x1="175" y1="140" x2="175" y2="112"/>
    <line x1="305" y1="140" x2="305" y2="112"/>
    <line x1="435" y1="140" x2="435" y2="112"/>
    <line x1="565" y1="140" x2="565" y2="112"/>
  </g>

  <!-- zebra -->
  <g fill="#FFFFFF" opacity="0.9">
    <rect x="110" y="180" width="520" height="6"/>
    <rect x="110" y="208" width="520" height="6"/>
  </g>
  <!-- panah penyeberangan -->
  <line x1="95" y1="197" x2="645" y2="197" stroke="#C2410C" stroke-width="3.5" marker-end="url(#panah)"/>
  <rect x="236" y="160" width="268" height="24" rx="5" fill="#FFF7ED" stroke="#C2410C" stroke-width="1"/>
  <text x="370" y="177" font-size="12.5" font-weight="700" fill="#9A3412" text-anchor="middle">Sekali menyeberang: 4 lajur (± 14 m)</text>

  <text x="40" y="262" font-size="12" fill="#374151">Pejalan kaki dan penumpang harus menyeberangi seluruh badan jalan tanpa tempat berhenti.</text>

  <!-- pemisah -->
  <line x1="40" y1="292" x2="760" y2="292" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- ============ PANEL B ============ -->
  <text x="40" y="326" font-size="17" font-weight="700" fill="#1F2937">B. Dengan halte median</text>
  <text x="40" y="346" font-size="12.5" fill="#4B5563">1 lajur kendaraan + halte pulau + jalur BRT + 2 lajur kendaraan</text>

  <!-- trotoar -->
  <rect x="40" y="364" width="70" height="160" fill="#EDE6DA"/>
  <rect x="690" y="364" width="70" height="160" fill="#EDE6DA"/>
  <text x="75" y="448" font-size="11" fill="#7A6E5A" text-anchor="middle" transform="rotate(-90 75 448)">TROTOAR</text>
  <text x="725" y="448" font-size="11" fill="#7A6E5A" text-anchor="middle" transform="rotate(90 725 448)">TROTOAR</text>

  <!-- lajur 1 -->
  <rect x="110" y="364" width="130" height="160" fill="#D4CEC6"/>
  <text x="175" y="386" font-size="11.5" fill="#5E5850" text-anchor="middle">Lajur 1</text>
  <line x1="175" y1="428" x2="175" y2="400" stroke="#8A8178" stroke-width="2" marker-end="url(#panahArus)"/>

  <!-- halte -->
  <rect x="240" y="364" width="80" height="160" fill="#FFFFFF" stroke="#00A651" stroke-width="2.5"/>
  <text x="280" y="420" font-size="12" font-weight="700" fill="#007A3D" text-anchor="middle">HALTE</text>
  <text x="280" y="436" font-size="10.5" fill="#007A3D" text-anchor="middle">pulau</text>

  <!-- jalur BRT -->
  <rect x="320" y="364" width="130" height="160" fill="#C8EFDB"/>
  <text x="385" y="386" font-size="11.5" font-weight="700" fill="#007A3D" text-anchor="middle">Jalur BRT</text>
  <rect x="345" y="398" width="80" height="34" rx="6" fill="#00A651"/>
  <text x="385" y="420" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">BUS</text>

  <!-- lajur 2 & 3 -->
  <rect x="450" y="364" width="240" height="160" fill="#D4CEC6"/>
  <line x1="570" y1="364" x2="570" y2="524" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="14 10"/>
  <g font-size="11.5" fill="#5E5850" text-anchor="middle">
    <text x="510" y="386">Lajur 2</text>
    <text x="630" y="386">Lajur 3</text>
  </g>
  <g stroke="#8A8178" stroke-width="2" marker-end="url(#panahArus)">
    <line x1="510" y1="428" x2="510" y2="400"/>
    <line x1="630" y1="428" x2="630" y2="400"/>
  </g>

  <!-- zebra -->
  <g fill="#FFFFFF" opacity="0.9">
    <rect x="110" y="468" width="130" height="6"/>
    <rect x="110" y="496" width="130" height="6"/>
    <rect x="320" y="468" width="370" height="6"/>
    <rect x="320" y="496" width="370" height="6"/>
  </g>

  <!-- tahap 1 -->
  <line x1="95" y1="485" x2="236" y2="485" stroke="#C2410C" stroke-width="3.5" marker-end="url(#panah)"/>
  <!-- tahap 2 -->
  <line x1="324" y1="485" x2="705" y2="485" stroke="#C2410C" stroke-width="3.5" stroke-dasharray="9 6" marker-end="url(#panah)"/>

  <!-- lampu pelican -->
  <g>
    <rect x="236" y="450" width="14" height="30" rx="3" fill="#374151"/>
    <circle cx="243" cy="459" r="4" fill="#EF4444"/>
    <circle cx="243" cy="471" r="4" fill="#22C55E"/>
    <rect x="310" y="450" width="14" height="30" rx="3" fill="#374151"/>
    <circle cx="317" cy="459" r="4" fill="#EF4444"/>
    <circle cx="317" cy="471" r="4" fill="#22C55E"/>
  </g>

  <!-- label tahap -->
  <rect x="40" y="540" width="330" height="44" rx="6" fill="#FFF7ED" stroke="#C2410C" stroke-width="1"/>
  <text x="52" y="558" font-size="12.5" font-weight="700" fill="#9A3412">Tahap 1: 1 lajur (± 3,5 m)</text>
  <text x="52" y="575" font-size="11.5" fill="#7C2D12">Penumpang langsung sampai di halte.</text>

  <rect x="384" y="540" width="376" height="44" rx="6" fill="#FFFFFF" stroke="#C2410C" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="396" y="558" font-size="12.5" font-weight="700" fill="#9A3412">Tahap 2 (jika terus menyeberang)</text>
  <text x="396" y="575" font-size="11.5" fill="#7C2D12">Jalur BRT + 2 lajur, dengan pelican crossing.</text>
</svg>
