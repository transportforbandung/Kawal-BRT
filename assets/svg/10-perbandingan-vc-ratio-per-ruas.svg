    .value { font: 500 15px 'IBM Plex Sans', sans-serif; fill: #2E2A26; }
    .value-good { font: 700 15px 'IBM Plex Sans', sans-serif; fill: #007A3D; }
    .value-warning { font: 700 15px 'IBM Plex Sans', sans-serif; fill: #D4600C; }
    .badge { font: 700 14px 'IBM Plex Sans', sans-serif; fill: #FFFFFF; }
    .note { font: 400 13px 'IBM Plex Sans', sans-serif; fill: #7A6E5A; }
  </style>

