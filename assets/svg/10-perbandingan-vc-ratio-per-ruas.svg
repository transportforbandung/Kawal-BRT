<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Perbandingan V/C Ratio per ruas jalan pada jam puncak pagi</title>
  <desc id="desc">Tabel perbandingan rasio volume terhadap kapasitas jalan sebelum dan setelah BRT beroperasi pada tujuh ruas jalan.</desc>
  <style>
    .title { font: 700 22px 'IBM Plex Sans', sans-serif; fill: #2E2A26; }
    .header { font: 700 14px 'IBM Plex Sans', sans-serif; fill: #FFFFFF; }
